name: Build AI Office for Mac

on:
  push:
    paths:
      - "desktop/ai-office/**"
      - ".github/workflows/desktop-ai-office.yml"
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop/ai-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/ai-office/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
      # No Apple Developer ID yet, so sign ad hoc: Apple Silicon refuses to run
      # an unsigned app. People still confirm the first launch once in macOS.
      - name: Sign ad hoc and zip
        run: |
          for arch in arm64 x64; do
            dir=dist/mac; [ "$arch" = arm64 ] && dir=dist/mac-arm64
            codesign --force --deep --sign - "$dir/AI Office.app"
            ditto -c -k --keepParent "$dir/AI Office.app" "dist/AI-Office-mac-$arch.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Office-mac
          path: desktop/ai-office/dist/AI-Office-mac-*.zip
          retention-days: 30
