name: Social manual post reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: social-manual-post-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger due reminders
        env:
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$PORTAL_BASE_URL"
          test -n "$CRON_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${PORTAL_BASE_URL%/}/api/social-manual-reminders"
