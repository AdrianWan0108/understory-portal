name: Social manual post reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: social-manual-post-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger due reminders
        env:
          PORTAL_BASE_URL: ${{ vars.PORTAL_BASE_URL || vars.PORTALLINK }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$PORTAL_BASE_URL" ]; then
            echo "::error::Set the PORTAL_BASE_URL repository variable (legacy PORTALLINK is also supported)."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the CRON_SECRET repository secret."
            exit 1
          fi
          case "$PORTAL_BASE_URL" in
            http://*|https://*) ;;
            *) PORTAL_BASE_URL="https://$PORTAL_BASE_URL" ;;
          esac
          curl --fail-with-body --silent --show-error \
            --retry 2 \
            --max-time 60 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${PORTAL_BASE_URL%/}/api/social-manual-reminders"
